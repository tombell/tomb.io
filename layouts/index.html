{{ define "main" }}
  {{ $notes := where site.RegularPages "Section" "notes" }}

  <section class="hero" aria-labelledby="home-title">
    <div>
      <h1 id="home-title">Notes from building software.</h1>

      <p>{{ site.Params.intro }}</p>
    </div>

  </section>

  <section class="section-block" aria-labelledby="recent-title">
    <div class="section-heading">
      <h2 id="recent-title">Notes</h2>
    </div>

    <div class="post-ledger post-ledger--home">
      {{ range first 6 $notes }}
        {{ partial "post-row.html" . }}
      {{ else }}
        <p class="empty-state">No notes yet.</p>
      {{ end }}
    </div>
  </section>
{{ end }}
